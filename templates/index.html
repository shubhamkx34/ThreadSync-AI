<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreadSync AI — Autonomous Agent System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg: #131314;
            --panel: #1e1f20;
            --border: #2d2e30;
            --border-strong: #37393b;
            --hover: #282a2c;
            --text: #e3e3e3;
            --muted: #8e918f;
            --accent: #a8c7fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .brand {
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:hover {
            background: var(--hover);
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 1.5rem 0 0.5rem;
        }

        .model-select {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 0.5rem;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }

        .model-select:focus {
            border-color: var(--accent);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .chat-item {
            background: transparent;
            border: none;
            color: var(--text);
            padding: 0.5rem;
            font-size: 0.85rem;
            text-align: left;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover {
            background: var(--hover);
        }

        /* Main Workspace */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            padding: 1rem 2rem;
            border-bottom: 1px solid #222426;
        }

        .topbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding-bottom: 150px;
        }

        .hero {
            text-align: center;
            margin-top: 10vh;
        }

        .hero h1 {
            font-size: 2.25rem;
            background: linear-gradient(90deg, var(--accent), var(--text), var(--muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--muted);
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
            line-height: 1.6;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }

        /* Input Area */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            background: linear-gradient(0deg, var(--bg) 60%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: flex-end;
            padding: 0.5rem;
            gap: 0.5rem;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--hover);
        }

        .icon-btn.recording {
            color: #ff5252;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 200px;
            padding: 0.25rem 0;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .disclaimer {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">🧩 ThreadSync</div>
        <button class="btn" onclick="newChat()">+ New chat</button>
        
        <div class="section-label">Model Selection</div>
        <!-- Matches ALLOWED_MODELS from agent.py -->
        <select id="modelSelect" class="model-select">
            <option value="openai/gpt-oss-120b" selected>GPT-OSS 120B</option>
            <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
        </select>

        <div class="section-label">Recent</div>
        <div class="chat-list" id="chatList">
            <button class="chat-item">No recent chats</button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main">
        <div class="topbar">
            <h1>ThreadSync</h1>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="hero" id="heroSection">
                <h1>Hello, I am ThreadSync, your assistant.</h1>
                <p>Tell me what you would like to explore, analyze, or simulate today.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="file" id="fileInput" accept=".pdf" style="display: none;" onchange="handleFileUpload()">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach PDF">
                    📎
                </button>
                
                <textarea 
                    id="messageInput" 
                    placeholder="Ask ThreadSync anything..." 
                    rows="1" 
                    oninput="autoResize(this)"
                    onkeydown="handleKey(event)"></textarea>
                
                <button class="icon-btn" id="micBtn" onclick="toggleDictation()" title="Voice Dictation">
                    🎙️
                </button>
                <button class="icon-btn" onclick="sendMessage()" title="Send">
                    ➤
                </button>
            </div>
            <div class="disclaimer">
                ThreadSync may produce inaccurate info. Verify important financial data.
            </div>
        </div>
    </main>

    <script>
        // --- Auto-Resizing Textarea ---
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // --- Voice Dictation (Speech-to-Text) ---
        let recognition = null;
        let isRecording = false;
        const micBtn = document.getElementById('micBtn');
        const messageInput = document.getElementById('messageInput');

        function toggleDictation() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Your browser does not support Speech Recognition.");
                return;
            }

            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = function() {
                    isRecording = true;
                    micBtn.classList.add('recording');
                };

                recognition.onresult = function(event) {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        messageInput.value += (messageInput.value ? ' ' : '') + finalTranscript;
                        autoResize(messageInput);
                    }
                };

                recognition.onerror = function(event) {
                    console.error("Speech recognition error", event.error);
                    stopDictation();
                };

                recognition.onend = function() {
                    if (isRecording) {
                        recognition.start(); 
                    } else {
                        micBtn.classList.remove('recording');
                    }
                };
            }

            if (isRecording) {
                stopDictation();
            } else {
                recognition.start();
            }
        }

        function stopDictation() {
            isRecording = false;
            if (recognition) recognition.stop();
            micBtn.classList.remove('recording');
        }

        // --- Chat Functionality ---
        const chatContainer = document.getElementById('chatContainer');
        const heroSection = document.getElementById('heroSection');

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function newChat() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(heroSection);
            heroSection.style.display = 'block';
            messageInput.value = '';
            autoResize(messageInput);
            if (isRecording) stopDictation();
        }

        function appendMessage(role, content) {
            heroSection.style.display = 'none';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '🧑' : '✨';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const meta = document.createElement('div');
            meta.className = 'meta';
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            meta.textContent = `${role === 'user' ? 'You' : 'ThreadSync'} · ${time}`;
            
            const text = document.createElement('div');
            text.textContent = content;
            
            contentDiv.appendChild(meta);
            contentDiv.appendChild(text);
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(contentDiv);
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return text;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            if (isRecording) stopDictation();

            const modelSelected = document.getElementById('modelSelect').value;
            appendMessage('user', text);
            
            messageInput.value = '';
            autoResize(messageInput);

            const aiTextNode = appendMessage('assistant', 'Thinking...');
            
            /* Add backend connection logic here using standard fetch.
               Ensure your FastAPI/Flask route accepts the configured model ID.

            fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text, model: modelSelected })
            }).then(res => res.json()).then(data => {
                aiTextNode.textContent = data.reply;
            });
            */
           
           setTimeout(() => {
               aiTextNode.textContent = `Response using model: ${modelSelected}\nReplace this mock timeout with a fetch call to your LangGraph backend endpoint.`;
           }, 1000);
        }

        function handleFileUpload() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                const fileName = fileInput.files[0].name;
                appendMessage('user', `Uploaded \`${fileName}\``);
                appendMessage('assistant', `I have received ${fileName}. Initializing RAG ingestion...`);
                // Add your FormData fetch logic here for rag_feature.py
            }
        }
    </script>
</body>
</html>
